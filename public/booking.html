<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay - THE CLOVERS GROUP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top scrolled" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="text-white">THE</span> <span
                    class="text-gold">CLOVERS</span> <span class="text-white">GROUP</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rooms.html">Rooms</a>
                    </li>
                    <li class="nav-item d-none d-lg-block ms-lg-3 mt-2 mt-lg-0">
                        <a class="btn btn-gold text-dark" href="rooms.html">Explore Rooms</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header mb-0"
        style="height: 35vh; min-height: 250px; background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/entrance.png');">
        <div class="container mt-5">
            <h1 class="font-heading text-gold display-4">Reservation</h1>
        </div>
    </header>

    <!-- Booking Form Section -->
    <section class="py-5" style="margin-top: -80px; position: relative; z-index: 10;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card bg-darker border-secondary shadow-lg">
                        <div class="card-body p-5">
                            <h3 class="font-heading text-white mb-4 border-bottom border-secondary pb-3">Guest Details
                            </h3>

                            <form id="bookingForm">
                                <div class="row g-4">
                                    <!-- Personal Info -->
                                    <div class="col-md-6">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="firstName" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="lastName" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="tel" class="form-control" id="phone" required>
                                    </div>

                                    <h3
                                        class="font-heading text-white mt-5 mb-4 border-bottom border-secondary pb-3 w-100">
                                        Stay Details</h3>

                                    <!-- Stay Info -->
                                    <div class="col-md-6">
                                        <label for="checkIn" class="form-label">Check-in Date</label>
                                        <input type="date" class="form-control" id="checkIn" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="checkOut" class="form-label">Check-out Date</label>
                                        <input type="date" class="form-control" id="checkOut" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="roomType" class="form-label">Room Type</label>
                                        <select class="form-control" id="roomType">
                                            <option>Select Room</option>
                                            <option>Deluxe Room - ₹3000/night</option>
                                            <option>Cabana Deluxe - ₹3500/night</option>
                                            <option>Master Suite Family - ₹4000/night</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="guests" class="form-label">Number of Guests</label>
                                        <select class="form-select" id="guests" required>
                                            <option value="1">1 Adult</option>
                                            <option value="2" selected>2 Adults</option>
                                            <option value="3">3 Adults</option>
                                            <option value="4">4 Adults</option>
                                        </select>
                                    </div>

                                    <!-- Summary & Submit -->
                                    <div class="col-12 mt-5">
                                        <div class="p-4 bg-dark border border-secondary rounded">
                                            <h4 class="font-heading text-gold mb-3">Booking Summary</h4>
                                            <div class="d-flex justify-content-between mb-2">
                                                <span class="text-muted">Room:</span>
                                                <span id="summaryRoom" class="text-white fw-bold">-</span>
                                            </div>
                                            <div class="d-flex justify-content-between mb-2">
                                                <span class="text-muted">Duration:</span>
                                                <span id="summaryNights" class="text-white fw-bold">0 nights</span>
                                            </div>
                                            <hr class="border-secondary">
                                            <div class="d-flex justify-content-between mb-0">
                                                <span class="text-muted fs-5">Total Est. Amount:</span>
                                                <span id="summaryTotal"
                                                    class="text-gold fs-4 font-heading fw-bold">₹0</span>
                                            </div>
                                        </div>
                                    </div>


                                    <button type="submit" class="btn btn-gold btn-lg px-5">Proceed to
                                        Payment</button>
                                </div>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </section>

    <!-- Footer Simple -->
    <footer class="py-4 text-center mt-auto" style="background-color: var(--darker-bg); border-top: 1px solid #222;">
        <div class="container">
            <p class="text-muted mb-0">&copy; 2026 THE CLOVERS GROUP. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set minimum dates for inputs
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('checkIn').min = today;
        document.getElementById('checkIn').addEventListener('change', function () {
            document.getElementById('checkOut').min = this.value;
        });

        // Parse URL params to auto-select room
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');

        if (roomFromUrl) {
            const roomSelect = document.getElementById('roomType');
            for (let i = 0; i < roomSelect.options.length; i++) {
                if (roomSelect.options[i].value === roomFromUrl) {
                    roomSelect.selectedIndex = i;
                    break;
                }
            }
        }

        // Summary calculation logic deferred to main.js
        function updateSummary() {
            if (typeof window.updatePrice === 'function') {
                window.updatePrice();
            }
            return window.bookingTotalAmount || 0;
        }

        document.getElementById('roomType').addEventListener('change', updateSummary);
        document.getElementById('checkIn').addEventListener('change', updateSummary);
        document.getElementById('checkOut').addEventListener('change', updateSummary);

        // Pre-calculate if from URL
        updateSummary();

        // Form Submission
        document.getElementById('bookingForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const total = updateSummary();

            // Bypass validation for demo purposes, assume dates valid

            // Save details to localStorage to use on payment page
            const bookingDetails = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                roomType: document.getElementById('roomType').value,
                checkIn: document.getElementById('checkIn').value,
                checkOut: document.getElementById('checkOut').value,
                guests: document.getElementById('guests').value,
                amount: total
            };

            localStorage.setItem('cloverBookingDetails', JSON.stringify(bookingDetails));

            // Redirect to payment
            window.location.href = 'payment.html';
        });
    </script>
</body>

</html>
